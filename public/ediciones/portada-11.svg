<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A0C16" />
      <stop offset="100%" stop-color="#5C0810" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Paper -->
  <rect width="400" height="550" fill="#FCFAF6" stroke="#E2DBD0" stroke-width="2" rx="4" />
  
  <!-- Masthead Bar -->
  <rect width="400" height="85" fill="url(#headerGrad)" />
  <rect y="85" width="400" height="4" fill="#C29B38" />
  
  <!-- Small Emblem Icon -->
  <circle cx="45" cy="42" r="22" fill="#C29B38" />
  <circle cx="45" cy="42" r="18" fill="#7A0C16" />
  <path d="M37 42 Q45 32 53 42 Q45 52 37 42 Z" fill="#C29B38" />
  
  <!-- Title in Masthead -->
  <text x="80" y="38" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#FFFFFF" letter-spacing="1">TRIBUNA MOCHICA</text>
  <text x="80" y="55" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#EAD9A8" letter-spacing="2">LA VOZ DEL VALLE LA LECHE</text>
  <text x="80" y="70" font-family="sans-serif" font-size="7.5" font-style="italic" fill="#FFFFFF" opacity="0.9">Director: Juan César Cabrejos Becerra</text>

  <!-- Date Bar -->
  <rect y="89" width="400" height="24" fill="#F0ECE1" />
  <text x="15" y="105" font-family="sans-serif" font-size="9" font-weight="bold" fill="#7A0C16">EDICIÓN N.° 11</text>
  <text x="385" y="105" font-family="sans-serif" font-size="8.5" fill="#57534E" text-anchor="end">Lunes 24 de agosto de 2026</text>

  <!-- Headline Section -->
  <rect x="15" y="125" width="370" height="110" fill="#FFFFFF" stroke="#E8E2D6" rx="4" />
  <rect x="15" y="125" width="6" height="110" fill="#7A0C16" />
  <text x="32" y="145" font-family="sans-serif" font-size="8" font-weight="bold" fill="#C29B38" letter-spacing="1">NOTICIA PRINCIPAL</text>
  
  <!-- Main Title lines -->
  <foreignObject x="32" y="152" width="340" height="75">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 13px; font-weight: bold; color: #1A1615; line-height: 1.35;">
      Comisión de avanzada del Vaticano evalúa espacios para la histórica visita del Papa León XIV
    </div>
  </foreignObject>

  <!-- Visual Mock / Article preview -->
  <rect x="15" y="248" width="180" height="135" fill="#EAE5DA" rx="4" />
  <circle cx="105" cy="300" r="28" fill="#D5CBB9" />
  <path d="M92 312 L105 285 L118 312 Z" fill="#7A0C16" opacity="0.7" />
  <text x="105" y="345" font-family="sans-serif" font-size="7.5" fill="#78716C" text-anchor="middle">Reportaje Gráfico Central</text>

  <rect x="205" y="248" width="180" height="135" fill="#FFFFFF" stroke="#E8E2D6" rx="4" />
  <text x="215" y="268" font-family="sans-serif" font-size="8" font-weight="bold" fill="#7A0C16">ACTUALIDAD REGIONAL</text>
  
  <rect x="215" y="278" width="160" height="6" fill="#DDD6C8" rx="2" />
  <rect x="215" y="290" width="145" height="6" fill="#DDD6C8" rx="2" />
  <rect x="215" y="302" width="155" height="6" fill="#DDD6C8" rx="2" />
  <rect x="215" y="314" width="130" height="6" fill="#DDD6C8" rx="2" />
  <rect x="215" y="326" width="150" height="6" fill="#DDD6C8" rx="2" />
  <rect x="215" y="338" width="110" height="6" fill="#DDD6C8" rx="2" />
  <rect x="215" y="355" width="70" height="16" fill="#7A0C16" rx="2" />
  <text x="250" y="366" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF" text-anchor="middle">VER PÁG. 3</text>

  <!-- Secondary News Cards -->
  <rect x="15" y="395" width="370" height="85" fill="#FFFFFF" stroke="#E8E2D6" rx="4" />
  <text x="28" y="415" font-family="sans-serif" font-size="8" font-weight="bold" fill="#C29B38">VALLE LA LECHE · ÍLLIMO · TÚCUME · MÓRROPE</text>
  <text x="28" y="433" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#1A1615">Avances en proyectos hídricos y desarrollo comunitario</text>
  <text x="28" y="450" font-family="sans-serif" font-size="8" fill="#57534E">Información descentralizada con la cobertura de nuestros corresponsales.</text>
  <rect x="28" y="460" width="100" height="3" fill="#C29B38" />

  <!-- Bottom Paper Strip -->
  <rect y="495" width="400" height="55" fill="#1A1615" />
  <rect y="495" width="400" height="2" fill="#C29B38" />
  <text x="200" y="520" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">TRIBUNA MOCHICA</text>
  <text x="200" y="535" font-family="sans-serif" font-size="7.5" fill="#C29B38" text-anchor="middle">Periódico Semanal · www.tribunamochica.pe</text>
</svg>