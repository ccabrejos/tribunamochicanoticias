  <line x1="40" y1="80" x2="560" y2="80" stroke="#7A0C16" stroke-width="3"/>
  <text x="300" y="130" font-family="'Playfair Display', serif" font-size="44" font-weight="900" fill="#1A1A1A" text-anchor="middle">TRIBUNA MOCHICA</text>
  <text x="300" y="160" font-family="'Inter', sans-serif" font-size="16" font-weight="bold" fill="#7A0C16" text-anchor="middle" letter-spacing="3">LA VOZ DEL VALLE LA LECHE</text>
  <line x1="40" y1="175" x2="560" y2="175" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="40" y1="180" x2="560" y2="180" stroke="#1A1A1A" stroke-width="0.75"/>
  
  <!-- Date bar -->
  <rect x="40" y="190" width="520" height="30" fill="#F8F6F2"/>
