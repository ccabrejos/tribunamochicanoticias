<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="600" height="850">
  <rect width="600" height="850" fill="#F4F1EA"/>
  <rect x="20" y="20" width="560" height="810" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="2"/>
  
  <!-- Header -->
