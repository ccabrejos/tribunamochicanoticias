<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158" />
      <stop offset="50%" stop-color="#C29B38" />
      <stop offset="100%" stop-color="#8E6E1F" />
    </linearGradient>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A121F" />
      <stop offset="100%" stop-color="#5C0810" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="80" cy="80" r="76" fill="url(#burgundyGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#logoShadow)"/>
  
  <!-- Inner Ring -->
  <circle cx="80" cy="80" r="66" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- Central Badge Backing -->
  <circle cx="80" cy="80" r="58" fill="#5C0810" />
  
  <!-- Mochica Crown / Tocado -->
  <path d="M48 62 C48 42, 112 42, 112 62 C100 56, 60 56, 48 62 Z" fill="url(#goldGrad)" />
  <circle cx="80" cy="46" r="6" fill="url(#goldGrad)" />
  <circle cx="62" cy="50" r="4" fill="url(#goldGrad)" />
  <circle cx="98" cy="50" r="4" fill="url(#goldGrad)" />
  
  <!-- Mochica Mask / Face -->
  <path d="M56 62 L104 62 L98 100 C98 112, 62 112, 62 100 Z" fill="url(#goldGrad)" />
  
  <!-- Eyes -->
  <ellipse cx="68" cy="74" rx="7" ry="5" fill="#5C0810" />
  <circle cx="68" cy="74" r="3" fill="#E5C158" />
  
  <ellipse cx="92" cy="74" rx="7" ry="5" fill="#5C0810" />
  <circle cx="92" cy="74" r="3" fill="#E5C158" />
  
  <!-- Nose -->
  <polygon points="80,75 75,90 85,90" fill="#8E6E1F" />
  
  <!-- Mouth / Nariguera -->
  <path d="M68 96 C74 102, 86 102, 92 96 C86 94, 74 94, 68 96 Z" fill="#5C0810" />
  
  <!-- Ear Ornaments (Orejeras) -->
  <circle cx="48" cy="80" r="10" fill="url(#goldGrad)" stroke="#5C0810" stroke-width="2" />
  <circle cx="48" cy="80" r="4" fill="#5C0810" />
  
  <circle cx="112" cy="80" r="10" fill="url(#goldGrad)" stroke="#5C0810" stroke-width="2" />
  <circle cx="112" cy="80" r="4" fill="#5C0810" />
  
  <!-- Star / Accent -->
  <polygon points="80,118 83,126 91,126 85,131 87,139 80,134 73,139 75,131 69,126 77,126" fill="url(#goldGrad)" transform="scale(0.5) translate(80, 110)" />
</svg>